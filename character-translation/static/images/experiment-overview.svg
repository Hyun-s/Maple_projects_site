<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">Maple character translation experiment overview</title>
  <desc id="desc">A conceptual pipeline from in-game avatar input through three methods to a generated portrait and quality and identity evaluation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f2ede4"/>
      <stop offset="1" stop-color="#e9e5dd"/>
    </linearGradient>
    <linearGradient id="portrait" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#274a42"/>
      <stop offset="1" stop-color="#17302b"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0v28" fill="none" stroke="#17201e" stroke-opacity=".045"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#17201e" flood-opacity=".11"/>
    </filter>
  </defs>

  <rect width="1200" height="460" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="460" rx="24" fill="url(#grid)"/>

  <g fill="none" stroke="#77807c" stroke-width="2" stroke-dasharray="6 9" opacity=".65">
    <path d="M287 230h98"/>
    <path d="M624 230h89"/>
    <path d="M942 230h63"/>
  </g>
  <g fill="#77807c" opacity=".75">
    <path d="m385 230-10-6v12Z"/>
    <path d="m713 230-10-6v12Z"/>
    <path d="m1005 230-10-6v12Z"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="72" y="86" width="215" height="288" rx="22" fill="#fffdfa" stroke="#d7d2c8"/>
    <rect x="92" y="106" width="175" height="201" rx="15" fill="#e4dfd5"/>
    <g shape-rendering="crispEdges">
      <rect x="142" y="139" width="76" height="25" fill="#6e3128"/>
      <rect x="130" y="164" width="101" height="37" fill="#923e30"/>
      <rect x="143" y="189" width="76" height="58" fill="#f0c4a1"/>
      <rect x="154" y="203" width="12" height="9" fill="#17201e"/>
      <rect x="196" y="203" width="12" height="9" fill="#17201e"/>
      <rect x="172" y="228" width="19" height="6" fill="#c97867"/>
      <rect x="133" y="247" width="96" height="39" fill="#d95535"/>
      <rect x="151" y="247" width="60" height="19" fill="#fff4dc"/>
      <rect x="102" y="273" width="31" height="13" fill="#274a42"/>
      <rect x="229" y="273" width="28" height="13" fill="#274a42"/>
    </g>
    <text x="92" y="338" fill="#17201e" font-family="Arial, sans-serif" font-size="14" font-weight="700">IN-GAME INPUT</text>
    <text x="92" y="357" fill="#707774" font-family="Arial, sans-serif" font-size="11">Approved benchmark asset</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="385" y="86" width="239" height="288" rx="22" fill="#fffdfa" stroke="#d7d2c8"/>
    <text x="410" y="120" fill="#17201e" font-family="Arial, sans-serif" font-size="14" font-weight="700">ADAPTATION METHOD</text>
    <g transform="translate(410 143)">
      <rect width="189" height="55" rx="12" fill="#f4dfd4"/>
      <circle cx="28" cy="27.5" r="15" fill="#d95535"/>
      <text x="28" y="32" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="12" font-weight="700">A</text>
      <text x="56" y="24" fill="#17201e" font-family="Arial, sans-serif" font-size="12" font-weight="700">Zero-shot</text>
      <text x="56" y="40" fill="#78645d" font-family="Arial, sans-serif" font-size="10">Prompt only</text>
    </g>
    <g transform="translate(410 208)">
      <rect width="189" height="55" rx="12" fill="#274a42"/>
      <circle cx="28" cy="27.5" r="15" fill="#d95535"/>
      <text x="28" y="32" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="12" font-weight="700">B</text>
      <text x="56" y="24" fill="#fff" font-family="Arial, sans-serif" font-size="12" font-weight="700">LoRA</text>
      <text x="56" y="40" fill="#bdd0c9" font-family="Arial, sans-serif" font-size="10">Low-rank adapters</text>
    </g>
    <g transform="translate(410 273)">
      <rect width="189" height="55" rx="12" fill="#e6e2da"/>
      <circle cx="28" cy="27.5" r="15" fill="#d95535"/>
      <text x="28" y="32" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="12" font-weight="700">C</text>
      <text x="56" y="24" fill="#17201e" font-family="Arial, sans-serif" font-size="12" font-weight="700">Null-token</text>
      <text x="56" y="40" fill="#707774" font-family="Arial, sans-serif" font-size="10">Embedding only</text>
    </g>
  </g>

  <g filter="url(#shadow)">
    <rect x="713" y="86" width="229" height="288" rx="22" fill="#fffdfa" stroke="#d7d2c8"/>
    <rect x="733" y="106" width="189" height="201" rx="15" fill="url(#portrait)"/>
    <circle cx="827" cy="202" r="79" fill="#fff" opacity=".045"/>
    <path d="M778 178c6-43 92-54 105-1l-8 51H785Z" fill="#8d3c2d"/>
    <path d="M790 189c8-27 70-29 79 2v41c0 33-16 55-40 55s-39-22-39-55Z" fill="#e9b995"/>
    <path d="M777 184c9-55 99-52 107 4-30-3-49-15-62-29-9 18-21 27-45 34Z" fill="#a84734"/>
    <path d="M799 222c6-6 14-6 20 0M839 222c6-6 14-6 20 0" fill="none" stroke="#17201e" stroke-width="3" stroke-linecap="round"/>
    <path d="M820 250c7 5 13 5 20 0" fill="none" stroke="#b7675e" stroke-width="3" stroke-linecap="round"/>
    <path d="M767 307c8-34 31-49 61-49 32 0 56 14 67 49Z" fill="#d95535"/>
    <path d="M808 264h40l-7 23h-25Z" fill="#fff0d8"/>
    <text x="733" y="338" fill="#17201e" font-family="Arial, sans-serif" font-size="14" font-weight="700">GENERATED OUTPUT</text>
    <text x="733" y="357" fill="#707774" font-family="Arial, sans-serif" font-size="11">Anime / realistic target style</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1005" y="112" width="135" height="236" rx="22" fill="#182321"/>
    <text x="1027" y="146" fill="#f59a78" font-family="Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1">EVALUATE</text>
    <g transform="translate(1027 169)">
      <circle cx="17" cy="17" r="17" fill="#d95535"/>
      <path d="m10 18 5 5 10-12" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="46" y="14" fill="#fff" font-family="Arial, sans-serif" font-size="12" font-weight="700">Quality</text>
      <text x="46" y="30" fill="#9fb0ab" font-family="Arial, sans-serif" font-size="9">Aesthetic · FID · IS</text>
    </g>
    <line x1="1027" y1="225" x2="1118" y2="225" stroke="#fff" stroke-opacity=".12"/>
    <g transform="translate(1027 246)">
      <circle cx="17" cy="17" r="17" fill="#486e64"/>
      <path d="M9 17c5-7 11-9 17 0-5 7-11 9-17 0Z" fill="none" stroke="#fff" stroke-width="2"/>
      <circle cx="17" cy="17" r="3" fill="#fff"/>
      <text x="46" y="14" fill="#fff" font-family="Arial, sans-serif" font-size="12" font-weight="700">Identity</text>
      <text x="46" y="30" fill="#9fb0ab" font-family="Arial, sans-serif" font-size="9">CLIP · LPIPS</text>
    </g>
    <rect x="1027" y="308" width="91" height="4" rx="2" fill="#fff" fill-opacity=".12"/>
    <rect x="1027" y="308" width="0" height="4" rx="2" fill="#f59a78"/>
    <text x="1027" y="329" fill="#7f928c" font-family="Arial, sans-serif" font-size="9">RESULTS PENDING</text>
  </g>
</svg>
