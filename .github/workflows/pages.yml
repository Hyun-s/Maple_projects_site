name: Deploy Maple Projects to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate static site
        run: node scripts/check-site.mjs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Stage public files only
        run: |
          mkdir -p _site/character-translation _site/chat
          cp index.html robots.txt sitemap.xml .nojekyll _site/
          cp -R static _site/
          cp character-translation/index.html _site/character-translation/
          cp -R character-translation/static _site/character-translation/
          cp chat/index.html _site/chat/
          cp -R chat/static _site/chat/

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
