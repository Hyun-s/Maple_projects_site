    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0l10 5-10 5Z" fill="#6b706e"/></marker>
  </defs>
  <rect width="1200" height="520" rx="28" fill="url(#bg)"/>
  <g font-family="Arial, sans-serif">
    <g transform="translate(56 80)">
      <rect width="205" height="145" rx="20" fill="#fffaf4" stroke="#d6cec2"/>
      <circle cx="39" cy="38" r="17" fill="#d65a3a"/><path d="M31 38h16M39 30v16" stroke="#fff" stroke-width="3"/>
      <text x="26" y="90" fill="#18201f" font-size="20" font-weight="700">Community</text><text x="26" y="116" fill="#69706d" font-size="14">experience evidence</text>
