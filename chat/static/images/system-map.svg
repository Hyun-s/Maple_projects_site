<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Maple Chat system map</title>
  <desc id="desc">Community and official sources are sanitized, indexed, retrieved, grounded with a knowledge graph, and answered through a local model.</desc>
